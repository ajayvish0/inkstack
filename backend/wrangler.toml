# Inkstack API (and, in production, the web app) on Cloudflare Workers.
name = "inkstack-dev"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# pg (used by @prisma/adapter-pg) needs Node.js APIs and TCP sockets.
compatibility_flags = ["nodejs_compat"]

# Secrets are never stored in this file.
#   Local: copy .dev.vars.example to .dev.vars
#   Production: npx wrangler secret put DATABASE_URL --env production
#               npx wrangler secret put JWT_SECRET --env production
[vars]
# The Vite dev server proxies /api here, so its origin may send cookie-authenticated writes.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[observability]
enabled = true

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# ---------------------------------------------------------------------------
# Production: one Worker serves the built SPA and the API from the same origin,
# so the session cookie is first-party and no CORS is needed.
#   npm run deploy   (from the repo root: builds the frontend, then deploys)
# ---------------------------------------------------------------------------
[env.production]
name = "inkstack"
vars = { ALLOWED_ORIGINS = "" }

[env.production.assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker handles the API and post pages (for link-preview meta tags);
# everything else is served straight from the static assets.
run_worker_first = ["/api/*", "/p/*"]

# Connection pooling near the database. Query caching is disabled on purpose:
# cached reads could show an author the old version of a post they just edited.
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "20a311317bfb43638e730ddad93d432a"

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
